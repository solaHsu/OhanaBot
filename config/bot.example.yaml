# Ohana 引擎配置模板（可提交，不含密钥）。
# 使用方法：复制为 config/bot.local.yaml 后填写；密钥只放环境变量。

mode: dry_run # replay | dry_run | live（live 且 send_enabled 才真正发送）
database: runtime/ohana.sqlite3

admins: [] # 管理员 QQ（可用 /exit 等指令）；留空时回退到 allowed_private_users

onebot:
  api_base: http://127.0.0.1:3000
  listen_host: 127.0.0.1
  listen_port: 8080
  event_path: /
  expected_self_id: null # Ohana 独立 QQ 号（建议填写，用于身份校验与 @ 判定）
  access_token_env: ONEBOT_ACCESS_TOKEN # 常规做法：令牌放环境变量，这里填变量名
  event_secret_env: ONEBOT_EVENT_SECRET # 常规做法：签名密钥放环境变量，这里填变量名
  access_token: "" # 可选：直接填令牌值（仅限不提交的本地文件）
  event_secret: "" # 可选：直接填签名密钥值（仅限不提交的本地文件）
  allowed_groups: [] # 允许参与的群号列表；空表示不接收任何群
  allowed_private_users: [] # 预留：私聊仅管理员指令（后续实现）
  self_aliases: ["ohana", "欧哈娜"] # 机器人名字别名（与群昵称一起用于“被叫名字”判定）

engine:
  send_enabled: false # 正式发送开关（live 模式下才会真正发送）
  merge_window_seconds: 3 # 参与态每 3 秒汇总一批
  replies_per_hour: 20 # 每小时 LLM 调用上限
  max_reply_characters: 300 # 单条回复长度上限
  max_images_per_call: 3 # 每次生成附带的本批图片上限（多模态）
  image_max_dimension: 768 # 图片长边上限（超大图自动压缩省 token；0 表示不压缩）
  max_links_per_call: 2 # 每次生成抓取的链接上限（分享卡片正文注入）

llm:
  model: deepseek-flash
  base_url: https://api.deepseek.com
  api_key: "" # 可选：直接填 Key（仅限不提交的本地文件）
  api_key_env: DEEPSEEK_API_KEY # 或把 Key 放这个环境变量里

harness:
  enabled: false # 重型任务分流到 DeepSeek Harness（action=task；需先安装 dsh）
  command: dsh # dsh 命令（不在 PATH 时可填全路径）
  timeout_seconds: 240 # 单个任务超时
  model: "" # 留空则用 dsh 默认模型
  workspace: runtime/harness # 任务工作目录（产物统一落此，相对仓库根）
