# Ohana 引擎配置模板（可提交，不含密钥）。
# 使用方法：复制为 config/bot.local.yaml 后填写；密钥只放环境变量。

mode: dry_run # replay | dry_run | live（live 且 send_enabled 才真正发送）
database: runtime/ohana.sqlite3

admins: [] # 管理员 QQ（可用 /exit 等指令）；留空时回退到 allowed_private_users

onebot:
  api_base: http://127.0.0.1:3000
  listen_host: 127.0.0.1
  listen_port: 8080
  event_path: /
  expected_self_id: null # Ohana 独立 QQ 号（建议填写，用于身份校验与 @ 判定）
  access_token_env: ONEBOT_ACCESS_TOKEN # 常规做法：令牌放环境变量，这里填变量名
  event_secret_env: ONEBOT_EVENT_SECRET # 常规做法：签名密钥放环境变量，这里填变量名
  access_token: "" # 可选：直接填令牌值（仅限不提交的本地文件）
  event_secret: "" # 可选：直接填签名密钥值（仅限不提交的本地文件）
  allowed_groups: [] # 允许参与的群号列表；空表示不接收任何群
  allowed_private_users: [] # 预留：私聊仅管理员指令（后续实现）
  self_aliases: ["ohana", "欧哈娜"] # 机器人名字别名（与群昵称一起用于“被叫名字”判定）

engine:
  send_enabled: false # 正式发送开关（live 模式下才会真正发送）
  merge_window_seconds: 3 # 参与态每 3 秒汇总一批
  replies_per_hour: 20 # 每小时 LLM 调用上限
  max_reply_characters: 300 # 单条回复长度上限
  max_images_per_call: 3 # 每次生成附带的本批图片上限（多模态）
  image_max_dimension: 768 # 图片长边上限（超大图自动压缩省 token；0 表示不压缩）
  max_links_per_call: 2 # 每次生成抓取的链接上限（分享卡片正文注入）
  recent_messages: 200 # 生成时携带的群内最近对话条数（不含本批；与记忆压缩批大小对齐）

policy: # 判定参数（可选；覆盖 bot/engine/policy/machine.py 的默认值）
  attend_window_minutes: 15 # 关注期时长：第三次触发（兴趣集命中）的时限，超时回旁观
  lucky_engage_probability: 0.003 # 每条他人消息直接升级参与的概率（0 = 关闭）

llm:
  model: deepseek-flash
  base_url: https://api.deepseek.com
  api_key: "" # 可选：直接填 Key（仅限不提交的本地文件）
  api_key_env: DEEPSEEK_API_KEY # 或把 Key 放这个环境变量里
  reasoning_effort: high # 思考档位：none/minimal/low/medium/high；质量优先用 high，赶速度用 minimal
  max_tokens: 8192 # 输出上限，必须覆盖思考 token + 回复正文（仅作保护，不实际扣费）
  retries: 2 # 可重试失败（空输出/限流/网络抖动）自动重试次数；截断与鉴权不重试

harness:
  enabled: false # 重型任务分流（action=task）
  backend: cli # cli = dsh headless（需装 dsh）；web = DeepSeek 网页版自动化（需装 playwright）
  command: dsh # 仅 cli：dsh 命令（不在 PATH 时可填全路径）
  timeout_seconds: 240 # 单个任务超时（web 后端深度思考+联网会慢些，建议 300~600）
  model: "" # 仅 cli：留空则用 dsh 默认模型
  workspace: runtime/harness # 任务工作目录（产物统一落此，相对仓库根）
  web: # 仅 web：首次先运行 python -m bot.engine.manage harness-login（换账号加 --reset）
    profile_dir: runtime/harness/web_profile # 登录态目录（相对仓库根）
    chat_url: https://chat.deepseek.com/ # 网页版地址
    headless: true # 无头运行；有头窗口仅首次登录需要
    deep_think: true # 发送前尝试打开「深度思考」
    search: true # 发送前尝试打开「智能搜索（联网）」
    new_chat: true # 每次任务开新对话
    stable_seconds: 5 # 输出连续无变化超过该秒数视为完成
    queue_wait_seconds: 120 # 等待其它任务让出浏览器的最长秒数
    save_documents: true # 结果落成 Markdown 文档（workspace 下，供文案引用）
    # selectors: {} # 页面改版时覆盖默认选择器：input / answer / copy / stop

knowledge:
  enabled: true # 知识库（GraphRAG-lite）：调研产物自动入库 + 按话题检索注入
  auto_ingest: true # 调研完成后自动分类：知识入库、新闻跳过
  top_k: 2 # 每次注入的知识块上限
  max_chars: 600 # 注入文本预算（字符）
  min_matches: 2 # 词法命中词数下限（不足时仅实体图扩展可入选）
  graph_hops: 1 # 实体图扩展跳数（0 = 关闭图扩展）
  inject_summaries: true # 命中实体时优先注入实体档案/主题综述（需先运行 knowledge consolidate）
  consolidate_backend: web # 档案/综述生成后端：web = 网页版（零 API token）；api = DeepSeek API
  classify_backend: web # 入库审核后端（rebuild 与任务完成后自动入库）：web / api

growth: # 记忆更新自动触发（人物画像 / 日常记录压缩）
  enabled: true # 待压缩消息满一批即在后台执行；失败不推进游标，下批消息后重试
  batch_size: 200 # 触发阈值（与对话上下文窗口对齐；手动 manage update 同参数）
  recent_logs: 3 # 更新上下文携带的最近日常记录段数
